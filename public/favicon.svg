<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="suiteGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0B132B" stroke="url(#suiteGrad)" stroke-width="2.5" />
  <!-- Telematics Radar Arc Rings -->
  <circle cx="32" cy="32" r="21" stroke="#38BDF8" stroke-opacity="0.25" stroke-dasharray="3 3" stroke-width="1.2" />
  <circle cx="32" cy="32" r="14" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.2" />
  <!-- Central Telematics Vehicle & Signal Beacon -->
  <path d="M32 14L45 42L32 36L19 42L32 14Z" fill="url(#suiteGrad)" filter="url(#shadowFilter)" />
  <circle cx="32" cy="34" r="3" fill="#FFFFFF" />
  <!-- Pulse Dot -->
  <circle cx="44" cy="18" r="3.5" fill="#10B981" />
  <circle cx="44" cy="18" r="6" stroke="#10B981" stroke-width="1" opacity="0.6" />
</svg>
